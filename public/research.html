<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Redirecting&hellip;</title>
		<meta name="robots" content="noindex" />
		<link rel="canonical" href="https://skoonkor.github.io/research/" />
		<!--
			The script, not the meta refresh, is the important line: a bare refresh
			drops the query string, and this demo's state (?n=&age=&mode=deep) is
			meant to be linkable from a talk or a footnote. location.replace also
			leaves no history entry, so Back still works.
		-->
		<script>
			location.replace("/research/" + location.search + location.hash);
		</script>
		<meta http-equiv="refresh" content="0;url=/research/" />
	</head>
	<body>
		<p>This page has moved to <a href="/research/">/research/</a>.</p>
	</body>
</html>
